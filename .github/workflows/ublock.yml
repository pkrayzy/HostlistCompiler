name: Build uBlock Filters

on:
  workflow_run:
    workflows: ["Download Filters"]
    types:
      - completed
  # For manual run builds
  workflow_dispatch:

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: yarn install --network-concurrency 1

      - name: Build uBlock Filters
        run: |
          TLS=insecure node src/cli.js -c examples/ublock/configuration.json -o ./optimized/ublock_optimized.txt
          TLS=insecure node src/cli.js -c examples/ublock_privacy/configuration.json -o ./optimized/ublock_privacy_optimized.txt
          TLS=insecure node src/cli.js -c examples/ublock_annoyances/configuration.json -o ./optimized/ublock_annoyances_optimized.txt
          TLS=insecure node src/cli.js -c examples/paywalls/configuration.json -o ./optimized/paywalls_optimized.txt
          TLS=insecure node src/cli.js -c examples/krayzylist/configuration.json -o ./optimized/krayzylist.txt

      - name: Push to repository
        run: |
          git config --global user.name "pkrayzy"
          git config --global user.email "pkrayzy@users.noreply.github.com"
          now=$(date)
          git add -A
          git commit -m "Update Filters on $now"
          git push

      - name: Trigger FiltersCompiler Quick Fixes
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/pkrayzy/FiltersCompiler/dispatches \
            -d '{"event_type":"trigger-quickfixes"}'
